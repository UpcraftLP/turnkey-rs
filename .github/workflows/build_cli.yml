name: Build CLI App

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-cli
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "server/**"
      - ".github/workflows/build_server.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  TURNKEY_OIDC_ISSUER_URL: ${{ vars.TURNKEY_OIDC_ISSUER_URL }}
  TURNKEY_OIDC_CLIENT_ID: ${{ vars.TURNKEY_OIDC_CLIENT_ID }}
  TURNKEY_SESSION_SERVER_URL: ${{ vars.TURNKEY_SESSION_SERVER_URL }}

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      REPOSITORY_NAME: ${{ steps.setup.outputs.REPOSITORY_NAME }}
      BUILD_TIME: ${{ steps.setup.outputs.BUILD_TIME }}
    steps:
      - name: Setup Environment
        id: setup
        run: |
          echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_OUTPUT
          echo BUILD_TIME=$(date '+%y.%m%d.%H%M') >> $GITHUB_OUTPUT

  build_matrix:
    name: Build (${{ matrix.os }} ${{ matrix.target_name }})
    needs:
      - init
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TIME: ${{ needs.init.outputs.BUILD_TIME }}
      APP_VERSION: ${{ needs.init.outputs.BUILD_TIME }}
      REPOSITORY_NAME: ${{ needs.init.outputs.REPOSITORY_NAME }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            target: x86_64-unknown-linux-gnu
            target_name: x64
          - os: ubuntu-26.04-arm
            os_name: linux
            target: aarch64-unknown-linux-gnu
            target_name: arm64
          - os: windows-latest
            os_name: windows
            target: x86_64-pc-windows-msvc
            target_name: x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev pkg-config libtss2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache-key: "${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}"

      - name: Test
        run: "cargo test --package turnkey_client --locked --all-features --verbose --target ${{ matrix.target }}"

      - name: Build
        run: "cargo build --package turnkey_client --locked --release --verbose --target ${{ matrix.target }}"

      - name: Generate Build Attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            target/${{ matrix.target }}/release/turnkey*
            !target/${{ matrix.target }}/release/turnkey*.d

      - name: Upload Artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.init.outputs.REPOSITORY_NAME }}-${{ matrix.os_name }}-${{ matrix.target_name }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/turnkey*
            !target/${{ matrix.target }}/release/turnkey*.d

#      - name: Publish Artifacts
#        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'UpcraftLP/turnkey-rs'
#        run: |
#          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -o artifact.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.upload.outputs.artifact-id }}/zip"
#          curl -fsSL -H "X-Api-Key: ${{ secrets.ARTIFACT_SERVER_TOKEN }}" -X PUT --form "file=@artifact.zip" ${{ secrets.ARTIFACT_SERVER_UPLOAD_URL }}/${{ env.REPOSITORY_NAME }}/${{ env.BUILD_TIME }}/${{ env.REPOSITORY_NAME }}-${{ matrix.os_name }}-${{ matrix.target_name }}-${{ env.BUILD_TIME }}.zip

  build_macOS:
    name: Build (MacOS)
    needs:
      - init
    permissions:
      id-token: write
      contents: read
      attestations: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: x86_64-apple-darwin, aarch64-apple-darwin
          cache-key: "macos-latest-${{ hashFiles('**/Cargo.lock') }}"

      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1

      - name: Test
        run: "cargo test --package turnkey_client --locked --all-features --verbose --target x86_64-apple-darwin"

      - name: Build (x64)
        run: "cargo build --package turnkey_client --locked --release --verbose --target x86_64-apple-darwin"

      - name: Build (arm64)
        run: "cargo build --package turnkey_client --locked --release --verbose --target aarch64-apple-darwin"

      - name: Combine
        run: |
          mkdir -p target/combined
          lipo -create -output target/combined/turnkey target/x86_64-apple-darwin/debug/turnkey target/aarch64-apple-darwin/debug/turnkey

      - name: Generate Build Attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            target/combined/turnkey*
            !target/combined/turnkey*.d

      - name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.init.outputs.REPOSITORY_NAME }}-macos-universal-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/combined/turnkey*
            !target/combined/turnkey*.d

#      - name: Publish Artifacts
#        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'UpcraftLP/turnkey-rs'
#        run: |
#          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -o artifact.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.upload.outputs.artifact-id }}/zip"
#          curl -fsSL -H "X-Api-Key: ${{ secrets.ARTIFACT_SERVER_TOKEN }}" -X PUT --form "file=@artifact.zip" ${{ secrets.ARTIFACT_SERVER_UPLOAD_URL }}/${{ needs.init.outputs.REPOSITORY_NAME }}/${{ needs.init.outputs.BUILD_TIME }}/${{ needs.init.outputs.REPOSITORY_NAME }}-macos-universal-${{ needs.init.outputs.BUILD_TIME }}.zip

  dependency_info:
    name: Submit Dependency Information
    needs:
      - build_matrix
      - build_macOS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Collect and submit dependency information
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
