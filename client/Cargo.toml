[package]
name = "turnkey_client"
edition = "2024"

[[bin]]
name = "turnkey"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "zstd"] }
"rootcause" = { workspace = true }
"serde" = { workspace = true }
chrono = { workspace = true }
"turnkey_shared" = { path = "../shared" }
"tokio" = { workspace = true }
"tracing" = { workspace = true }
"tracing-subscriber" = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
huskarl = { workspace = true, features = ["authorization-flow-loopback", "experimental-oidc-key-binding", "tracing"] }
huskarl-reqwest = { workspace = true }
huskarl-crypto-native = { workspace = true }
default-env = "0.1.1"
webbrowser = { version = "1.2.5", features = ["hardened", "disable-wsl"] }
extension-traits = "2.0.3"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
http.workspace = true
url = "2.5.8"
hardware-enclave = { version = "0.2.10", features = ["linux-tpm", "keyring-storage", "signing", "encryption"], default-features = false }
p256 = { version = "0.14.0", features = ["ecdsa"] }
directories = "6.0.0"
